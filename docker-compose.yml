version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-poc_demo}
      POSTGRES_USER: ${POSTGRES_USER:-poc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-poc}"]
      interval: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    volumes:
      # Docker socket is required for managing sandbox containers (terminal,
      # RAG, parser, simulator). In production, consider rootless Docker or
      # a remote Docker API endpoint to reduce container-escape risk.
      - /var/run/docker.sock:/var/run/docker.sock
      - poc-demo-data:/poc-data
      - backend-logs:/app/logs
    environment:
      PYTHONUNBUFFERED: "1"
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-poc}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-poc_demo}"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      RATE_LIMIT_DEFAULT: ${RATE_LIMIT_DEFAULT:-120/minute}
      ERROR_DEBUG: ${ERROR_DEBUG:-false}
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    group_add:
      - ${DOCKER_GID:-999}

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "${FRONTEND_PORT:-5175}:80"
      - "${FRONTEND_TLS_PORT:-443}:443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:80/ > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      - backend
    restart: unless-stopped

networks:
  default:
    name: poc-demo-network
  poc-sandbox-isolated:
    name: poc-sandbox-isolated
    driver: bridge
    ipam:
      config:
        - subnet: 10.200.0.0/16

volumes:
  pgdata:
    name: poc-demo-pgdata
  poc-demo-data:
    name: poc-demo-data
  backend-logs:
    name: poc-demo-logs
