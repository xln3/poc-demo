# Detect browser navigation (Accept: text/html) vs API fetch requests.
# Browser direct URL access / refresh should serve the SPA, not backend JSON.
map $http_accept $is_spa_request {
    ~text/html  1;
    default     0;
}

# Request body limit (for file uploads / eval import)
client_max_body_size 50m;

server {
    listen 80;
    server_name _;

    # Docker DNS resolver — enables runtime resolution for proxy_pass variables
    resolver 127.0.0.11 valid=10s;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Static assets — immutable cache (Vite hashed filenames)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback (non-asset, non-API routes like /risks, /reports)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- eval-poc backend (rewrite /eval-api/* → /api/*) ----
    location /eval-api/ {
        rewrite ^/eval-api/(.*)$ /api/$1 break;
        set $eval_backend http://eval-backend:8001;
        proxy_pass $eval_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        # Long timeout for evaluations (up to 1 hour)
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }

    # ---- poc-demo backend (all API routes) ----
    # 'eval/' (with slash) prevents matching SPA route '/evals/*'
    # 'eval-templates' added explicitly (was previously caught by bare 'eval')
    location ~ ^/(sandbox|rag|cases|health|mcp|datasets|file-parser|test-results|report-templates|report-editor|auth|api|clawdbot|eval-import|eval-templates|simulator|benchmarks|eval/|agents|usage) {
        # Browser navigation (Accept: text/html) to API paths → serve SPA.
        # API fetch requests (Accept: */*, application/json) pass through to backend.
        if ($is_spa_request) {
            rewrite ^ /index.html last;
        }

        set $poc_backend http://poc-demo-backend:8000;
        proxy_pass $poc_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;

        # Streaming (LLM proxy, simulator)
        proxy_buffering off;
    }
}
