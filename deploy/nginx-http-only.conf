# HTTP-only config — for local development without TLS certificates.
# Usage: mount this as nginx.conf in docker-compose override:
#   volumes:
#     - ./deploy/nginx-http-only.conf:/etc/nginx/conf.d/default.conf:ro

client_max_body_size 50m;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers (same as TLS version minus HSTS)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' ws: wss:; img-src 'self' data: blob:;" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/(sandbox|rag|cases|health|mcp|datasets|file-parser|test-results|report-templates|auth|api|clawdbot|eval-import|simulator) {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
        proxy_buffering off;
    }
}
