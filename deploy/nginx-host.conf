# Agent Safety Platform — HOST nginx site (replaces the compose `frontend` container).
#
# Why host-level instead of a container: on this server mihomo runs a TUN with auto-route
# (policy-routing rule `9002: not from all iif lo lookup 2022` → default via dev Meta).
# Docker-published ports answer from FORWARDED traffic (iif = docker bridge, src = 172.20.x),
# which matches rule 9002 and gets pulled into the TUN — so :5175 was reachable locally but
# NOT from the public IP. A host nginx process answers with iif=lo and falls through to the
# main table, egressing normally (exactly like the working :3002 host process).
#
# Deploy: symlinked to /etc/nginx/conf.d/asp-frontend.conf. Static bundle served from
# /var/www/asp-frontend/html (copied out of the frontend image via `docker cp`).
# Backends are reached over published host loopback ports (see docker-compose.yml):
#   poc-demo-backend -> 127.0.0.1:8000 ,  eval-backend -> 127.0.0.1:8001

# Detect browser navigation (Accept: text/html) vs API fetch — browser URL access/refresh
# to an API-shaped path should serve the SPA, not backend JSON.
map $http_accept $asp_is_spa {
    ~text/html  1;
    default     0;
}

server {
    listen 5175;
    listen [::]:5175;
    server_name _;

    client_max_body_size 50m;

    root /var/www/asp-frontend/html;
    index index.html;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Static assets — immutable cache (Vite hashed filenames)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback (non-asset, non-API routes like /risks, /reports)
    # index.html 必须每次重验证——否则部署新版前端后浏览器可能继续用旧 bundle
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    # ---- eval-poc backend (rewrite /eval-api/* -> /api/*) ----
    location /eval-api/ {
        rewrite ^/eval-api/(.*)$ /api/$1 break;
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }

    # ---- poc-demo backend (all API routes) ----
    # 'eval/' (with slash) prevents matching SPA route '/evals/*';
    # 'eval-templates' listed explicitly so it isn't swallowed by a bare 'eval'.
    location ~ ^/(sandbox|rag|cases|health|mcp|datasets|file-parser|test-results|report-templates|report-editor|auth|api|clawdbot|eval-import|eval-templates|simulator|benchmarks|eval/|agents|usage) {
        # Browser navigation to an API path -> serve the SPA; real fetch/XHR -> backend.
        if ($asp_is_spa) {
            rewrite ^ /index.html last;
        }

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;

        # Streaming (LLM proxy, simulator)
        proxy_buffering off;
    }
}
